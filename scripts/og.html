    <canvas id="f" width="2400" height="1260"></canvas>

    <script>
      // A still version of the hero's iron filings (src/scripts/field.ts).
      const c = document.getElementById("f").getContext("2d");
      c.scale(2, 2);
      const mx = 930, my = 315, r = 110;
      const poles = [{ x: mx - r, y: my, q: 1.6 }, { x: mx + r, y: my, q: -1.6 }, { x: 420, y: 700, q: 0.25 }];
      for (let y = 0; y < 640; y += 15) for (let x = (y / 15) % 2 ? 7 : 0; x < 1210; x += 15) {
        const px = x + (Math.random() - 0.5) * 9, py = y + (Math.random() - 0.5) * 9;
        let ex = 0, ey = 0;
        for (const p of poles) { const dx = px - p.x, dy = py - p.y, d2 = dx * dx + dy * dy + 400; ex += p.q * dx / d2; ey += p.q * dy / d2; }
        const k = Math.min(1, Math.log1p(Math.hypot(ex, ey) * 500) / 3.4), a = Math.atan2(ey, ex);
        const len = 15 * 0.36 * (0.55 + Math.random() * 0.9) * (0.65 + k * 0.7);
        const mix = (s, b) => Math.round(s + (b - s) * k * k);
        c.strokeStyle = k < 0.7 ? `rgba(${mix(147, 235)},${mix(164, 196)},${mix(184, 132)},${0.07 + k * 0.6})` : `rgba(236,128,72,${0.07 + k * 0.6})`;
        c.lineWidth = 1 + k * 0.6; c.lineCap = "round";
        c.beginPath(); c.moveTo(px - Math.cos(a) * len, py - Math.sin(a) * len); c.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len); c.stroke();
      }
    </script>
