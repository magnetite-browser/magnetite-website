name: Something is wrong on the website
description: A mistake, a broken link, a page that looks or behaves wrong.
labels: []
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, e.g. https://magnetitebrowser.org/download/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What you see, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      description: Only for things that look or behave wrong, e.g. "Firefox 145 on Windows 11".
