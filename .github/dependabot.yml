# Weekly dependency updates, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # astro check does not support TypeScript 7 yet and asks for TypeScript 6.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The build and web server images in the Dockerfile, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
